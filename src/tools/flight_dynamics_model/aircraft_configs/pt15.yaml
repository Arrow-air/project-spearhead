id: pt15
label: PT1.5 MAD lift + pusher (estimate)
description: PT1.5 build estimate at 22 kg (PT1 plus pusher, pusher battery, servos, tail electronics and skin; lift units changed to MAD V8013 150KV / AMPX 80A / FLUXER PRO 26x7.8 and pusher to HOBBYWING 5230SL 380KV / AMPX 80A / APC 20x12 on 21 November 2026) with the October AeroDB. Lift-rotor and pusher x/y come from the 14 October 2026 drawing table. CG is the simulation target inside the 22 m/s stability window, not a measurement; the PT1.5 build must be weighed and ballasted to it. Inertia and rate damping are component build-up and vortex-lattice estimates. Lift thrust is the MAD 48 V sheet rebuilt at 1.021 kg/m3; the pusher is a motor-equilibrium estimate with APC's 20x12 Sport map behind a 45 % output limit. Neither is bench-validated.
aircraft:
  # 21.0 kg KDE-based estimate + 0.81 kg lift units (4 x: motor +0.184, propeller +0.017,
  # ESC taken as equal) + 0.23 kg pusher motor (HOBBYWING 590 g vs KDE 360 g). Weigh PT1.5.
  mass: 22.0
  # Body axes from the CFD origin (wing root quarter-chord): x forward, z down.
  # x: target inside the 22 m/s window (SM about 6 %, elevator trim about -18 deg);
  # PT1.5 build-up estimate without ballast is about -0.085 m after the 21 November
  # hardware change (heavier pusher). z: build-up estimate, unmeasured.
  cg_body_xyz: [-0.040, 0.0, 0.065]
  # Component build-up estimate about the estimated PT1.5 CG (14 October 2026), +/-20 %,
  # plus the 21 November lift-unit and pusher mass increments as point masses at their stations.
  inertia: [[4.67, 0.0, -0.31], [0.0, 4.51, 0.0], [-0.31, 0.0, 8.78]]
  rho: 1.021
geometry:
  tail_chord: null
  tail_area: null
aerodynamics:
  dataset: tail_update_2026_10_07
  # Wing + inverse-V-tail vortex-lattice estimates (no fuselage/booms), per radian
  # with p*b/2V, q*c/2V, r*b/2V. Cmq is for the target CG; it scales with tail arm.
  rate_derivatives: {Cmq: -9.7, Clp: -0.58, Clr: 0.10, Cnp: -0.04, Cnr: -0.04}
battery:
  cells: 12
  voltage_v: 44.4
  capacity_ah: 22.0
  mass_kg: 3.709
propulsion:
  pusher:
    # PT1.5 pusher (21 November 2026): HOBBYWING PLATINUM 5230SL 380KV with a MAD AMPX 80A and
    # the APC 20x12 Sport, on the 12S pusher pack. The motor is rated for 6-8S; at 12S its
    # no-load speed is about 16,900 RPM, so the output is limited to 45 % of the ESC range by
    # the pusher servo endpoint (SERVO3_MAX), which applies in every flight mode. THR_MAX does
    # not limit MANUAL. Analytical estimate, not bench validation.
    installed: true
    selected: hobbywing
    options:
      hobbywing:
        label: HOBBYWING 5230SL 380KV · AMPX 80A · 45 % limit
        current_limit_label: AMPX continuous rating (needs cooling)
        motor:
          model: HOBBYWING PLATINUM 5230SL 380KV
          kv_rpm_per_v: 380
          # Fitted to the HOBBYWING 29.6 V sheet up to 80 A (scripts/fit_hobbywing_pusher_motor.py);
          # published: 4.0 A at 22.2 V, 7.8 mOhm phase resistance.
          no_load_current_a: 5.3393
          phase_resistance_ohm: 0.0078
          battery_rating: LiPo 6-8S
          max_current_a_82s: 162
          mass_kg: 0.590
          source: https://www.hobbywingdirect.com/products/platinum-fw-5230-motors
          electrical_data: ../data/propulsion/hobbywing_5230sl_380_pusher_fit.json
          data_edition: HOBBYWING PLATINUM 5230SL data sheet, 380KV rows at 29.6 V (APC 17x10E, 18x10E, 18x12E)
        esc:
          model: MAD AMPX 80A (5-14S)
          continuous_current_a: 80
          voltage_cells_min: 5
          voltage_cells_max: 14
          # Factory throttle range; the ESC is calibrated to it and SERVO3_MAX applies the limit.
          pwm_range_us: [1050, 1940]
          mass_kg_without_wires: 0.090
          source: https://mad-motor.com/products/mad-ampx-80a-5-14s-esc
        propeller:
          model: APC 20x12 Sport LP20012
          diameter_in: 20.0
          pitch_in: 12.0
          blades: 2
          # APC Sport limit 190000 / diameter.
          max_rpm: 9500
          source: https://www.apcprop.com/product/20x12/
        performance_path: ../data/propulsion/sources/PER3_20x12.dat
        equivalent_resistance_ohm: 0.026870
        esc_efficiency: 0.97
        voltage_min_v: 36.0
        voltage_max_v: 50.4
        # Model limits: AMPX 80A continuous current at the full 12S pack voltage.
        max_current_a: 80.0
        max_input_power_w: 4032.0
        sustainable_current_a: 80.0
        # 100 % commanded throttle = SERVO3_MAX 1450 us = (1450-1050)/(1940-1050) of the AMPX
        # range: at most about 55 A and 7,560 RPM on a full pack, about 74 N static at 44.4 V.
        output_limit: 0.4494
        # Drawing x = 374 mm aft of the origin. Mount height is open (+40 to -50 mm, z up);
        # the candidate is the lowest option, closest to the estimated CG height.
        position_body_m: [-0.374, 0.0, 0.050]
        reaction_torque_sign: 0
  lift:
    # PT1.5 lift units (21 November 2026): MAD V8013 150KV, MAD AMPX 80A, MAD FLUXER PRO 26x7.8 MATT.
    motor:
      model: MAD V8013 PRO 150KV
      data_edition: MAD V8013 IPE 150KV test sheet with FLUXER PRO 26x7.8 MATT and AMPX 80A; confirm installed PRO edition
      kv_rpm_per_v: 150
      phase_resistance_ohm: 0.037
      no_load_current_a: 2.35
      no_load_test_voltage_v: 30
      mass_kg: 0.544
      # Sheet: below 24 A sustainable; 24-78 A short term (about 10-30 s).
      sustainable_current_a: 24
      short_term_current_a: 78
      max_power_w: 3569
      source: https://mad-motor.com/products/v8013-pro-ipe-vtol-drone-motor
    esc:
      model: MAD AMPX 80A (5-14S)
      continuous_current_a: 80
      voltage_cells_min: 5
      voltage_cells_max: 14
      # Factory range 1050-1940 us; calibrate to Q_M_PWM_MIN/MAX (1100-1940 us in SITL).
      pwm_range_us: [1050, 1940]
      mass_kg_without_wires: 0.090
      source: https://mad-motor.com/products/mad-ampx-80a-5-14s-esc
    propeller:
      model: MAD FLUXER PRO 26x7.8 MATT
      diameter_in: 26.0
      pitch_in: 7.8
      blades: 2
      mass_kg: 0.069
      source: https://mad-motor.com/products/fluxer-matt-pro-26x78-inch
    # 14 October 2026 drawing (X aft, Z up from the CFD origin) converted to body axes.
    # Order FR, RR, RL, FL = ArduPilot motors 1, 4, 2, 3.
    positions_body_m: [[0.675, 0.55, -0.043], [-0.750, 0.55, -0.043], [-0.750, -0.55, -0.043], [0.675, -0.55, -0.043]]
    reaction_torque_signs: [1, -1, 1, -1]
    # MAD 48 V sheet rebuilt at 1.021 kg/m3 over 36-50.4 V (scripts/build_mad_lift_curve.py).
    performance_path: ../data/propulsion/mad_v8013_150_fluxer26_rho1021.csv
