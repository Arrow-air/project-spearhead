name: pt1_static_lift
aircraft_config: pt1_as_built
trim:
  enabled: false
simulation:
  duration: 10
  dt: 0.02
# NED position, body velocity, Euler attitude, body rates. No ground/contact model.
initial_state: [0, 0, -20, 0, 0, 0, 0, 0, 0, 0, 0, 0]
control:
  throttle: 0
  # Static weight-support estimate for the selected mass/voltage, not a hover controller.
  lift_throttle: hover
inputs:
  lift_throttle:
    type: doublet
    amplitude_fraction: 0.03
    start_time: 2
    duration: 2
