<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arrow · Flight simulator embed preview</title>
  <style>
    body { margin:0; background:#00030a; color:#fff; font-family:Arial,sans-serif; }
    header { background:#0943bf; padding:20px 24px; display:flex; align-items:center; gap:24px; }
    header img { width:132px; }
    header span { font-size:12px; letter-spacing:1px; text-transform:uppercase; }
    main { max-width:1600px; margin:auto; }
  </style>
</head>
<body>
  <header><img src="https://www.arrowair.com/images/arrow-flint_logo-lockup-white2x.png" alt="Arrow"><span>Website embed preview</span></header>
  <main>
    <iframe id="arrow-flight-deck" src="/embed" title="Arrow Spearhead flight simulator"
      referrerpolicy="origin" style="display:block;width:100%;height:1200px;border:0;background:#00030a"></iframe>
  </main>
  <script>
    const frame = document.getElementById('arrow-flight-deck');
    const origin = new URL(frame.src, document.baseURI).origin;
    window.addEventListener('message', event => {
      if (event.origin !== origin || event.source !== frame.contentWindow) return;
      const m = event.data;
      if (m?.type === 'arrow-flight-deck:size' && Number.isFinite(m.height))
        frame.style.height = Math.max(400,Math.min(5000,m.height))+'px';
    });
  </script>
</body>
</html>
