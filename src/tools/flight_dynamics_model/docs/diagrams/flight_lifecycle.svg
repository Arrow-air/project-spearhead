<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="485" viewBox="0 0 1080 485" role="img" aria-labelledby="title desc">
<title id="title">Flight lifecycle</title><desc id="desc">Plan the flight, initialize firmware, fly the maneuver, then review the recording. Setup failures, stop requests and envelope failures stop with a reason and preserve the recording.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#5b8dee" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
<style>text {font-family: 'Neue Haas Grotesk', Arial, Helvetica, sans-serif;} .eyebrow {font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#5b8dee;} .title {font-size:30px;font-weight:700;fill:#f3f4f6;} .heading {font-size:23px;font-weight:700;fill:#f3f4f6;} .body {font-size:15px;fill:#b2b3b5;} .caption {font-size:13px;fill:#b2b3b5;} .number {font-size:12px;font-weight:700;fill:#5b8dee;}</style>
<rect width="1080" height="485" rx="16" fill="#1b1b1d"/>
<text x="48" y="36" class="eyebrow">SPEARHEAD / 02 · FLIGHT WORKFLOW</text>
<text x="48" y="82" class="title">From flight plan to recorded review</text>
<text x="48" y="111" class="body">Four clear stages, with progress and results visible throughout.</text>
<rect x="48" y="152" width="234" height="182" rx="10" fill="#242526" stroke="#3b3d42" stroke-width="1.2"/>
<text x="68" y="183" class="number">01</text>
<text x="68" y="221" class="heading">PLAN</text>
<text x="68" y="258" class="body">Aircraft and start</text>
<text x="68" y="282" class="body">Maneuver and duration</text>
<path d="M284 242 L295 242" stroke="#5b8dee" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="298" y="152" width="234" height="182" rx="10" fill="#242526" stroke="#3b3d42" stroke-width="1.2"/>
<text x="318" y="183" class="number">02</text>
<text x="318" y="221" class="heading">INITIALIZE</text>
<text x="318" y="258" class="body">Validate firmware</text>
<text x="318" y="282" class="body">Navigation and arming</text>
<text x="318" y="306" class="body">Motor startup</text>
<path d="M534 242 L545 242" stroke="#5b8dee" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="548" y="152" width="234" height="182" rx="10" fill="#242526" stroke="#5b8dee" stroke-width="1.2"/>
<text x="568" y="183" class="number">03</text>
<text x="568" y="221" class="heading">FLY</text>
<text x="568" y="258" class="body">Release physics</text>
<text x="568" y="282" class="body">Apply the maneuver</text>
<text x="568" y="306" class="body">Observe the response</text>
<path d="M784 242 L795 242" stroke="#5b8dee" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="798" y="152" width="234" height="182" rx="10" fill="#242526" stroke="#3b3d42" stroke-width="1.2"/>
<text x="818" y="183" class="number">04</text>
<text x="818" y="221" class="heading">REVIEW</text>
<text x="818" y="258" class="body">Inputs and motion</text>
<text x="818" y="282" class="body">Result and limitations</text>
<text x="818" y="306" class="body">Saved recording</text>
<rect x="48" y="365" width="984" height="77" rx="10" fill="#242526" stroke="#3b3d42" stroke-width="1.2"/>
<rect x="48" y="379" width="3" height="49" rx="1.5" fill="#e8bd79"/>
<text x="70" y="391" font-size="11" font-weight="700" letter-spacing="1.6" fill="#e8bd79">STOPPED EARLY</text>
<text x="70" y="418" class="body">Setup failure, Stop request or envelope failure → stop with reason; preserve and review the recording.</text>
</svg>
