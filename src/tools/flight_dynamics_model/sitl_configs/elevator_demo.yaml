# NOT PHYSICAL: CG z = +0.45 m lies below the 275 mm fuselage. It only gives the 25 kg
# reference model a stable trim for software regression; not a PT1.5 or Spearhead result.
# Physical +/-1 deg elevator doublet in MANUAL; no attitude controller.
# 32 m/s provides alpha and nose-up surface authority around diagnostic trim.
firmware: Plane-4.7.1
aircraft: reference_design
aerodynamics: tail_update_2026_10_07
cg_body_xyz_m: [0.013595893369954063, 0.0, 0.45]
speed_m_s: 32.0
altitude_m: 100.0
max_step_s: 0.0025
physics_rate_hz: 200
control_deflection_policy: linear
channels:
  aileron: {number: 1, travel_deg: 20}
  elevator: {number: 2, reverse: true, travel_deg: 20}
  pusher: {number: 3}
  rudder: {number: 4, travel_deg: 20}
